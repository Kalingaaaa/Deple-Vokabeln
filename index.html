<script>
// --- Repõe a mesma interface de window.storage usada nos artefactos Claude,
// mas fala com a função serverless /api/vocab (Vercel KV) — assim os dados
// ficam disponíveis em qualquer dispositivo/navegador, não apenas localmente.
(function(){
  const TOKEN_KEY = 'vocabDeple:apiToken';

  function getToken(){
    let t = localStorage.getItem(TOKEN_KEY);
    if (!t){
      t = window.prompt('Password do teu vocabulário (a mesma em todos os dispositivos):') || '';
      if (t) localStorage.setItem(TOKEN_KEY, t);
    }
    return t;
  }

  async function apiRequest(method, key, value){
    const token = getToken();
    let url = '/api/vocab?key=' + encodeURIComponent(key) + '&token=' + encodeURIComponent(token);
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (method === 'POST'){
      opts.body = JSON.stringify({ key, value, token });
    }
    let res;
    try {
      res = await fetch(url, opts);
    } catch (networkErr){
      const e = new Error('Falha de rede ao contactar a API: ' + networkErr.message);
      e.isNetworkError = true;
      throw e;
    }
    if (res.status === 401){
      localStorage.removeItem(TOKEN_KEY);
      const e = new Error('Password incorreta. Recarrega a página para tentar novamente.');
      e.isAuthError = true;
      throw e;
    }
    if (!res.ok){
      const errBody = await res.json().catch(() => ({}));
      const e = new Error(errBody.error || ('Erro na API: ' + res.status));
      e.isServerError = true;
      throw e;
    }
    return res.json();
  }

  window.storage = {
    async get(key, shared){
      const data = await apiRequest('GET', key);
      if (data.value === null || data.value === undefined){
        const e = new Error('key not found: ' + key);
        e.trulyNotFound = true;
        throw e;
      }
      return { key, value: data.value, shared: !!shared };
    },
    async set(key, value, shared){
      await apiRequest('POST', key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      // não utilizado atualmente pela aplicação
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      // não utilizado atualmente pela aplicação
      return { keys: [], prefix, shared: !!shared };
    }
  };
})();

function addDaysStr(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function ensureSpacedFields(e){

function renderLoadError(){

    ⚠️ <strong>Não foi possível carregar o teu vocabulário</strong> (erro de ligação à API).<br><br>
    Por segurança, nada foi guardado nem apagado — os teus dados continuam intactos no servidor.<br><br>
    Recarrega a página para tentar novamente.<br><br>
    <span style="font-size:11px; color:#8A9490;">Detalhe técnico: ${escapeHtml(loadError || '')}</span>
  </div>`;
}

async function loadEntries(){
  try {
    const res = await window.storage.get(editingKey, false);
    if (res && res.value) {
      entries = JSON.parse(res.value);
    } else {
      entries = SEED.map(([pt,de,cat]) => ({id: uid(), pt, de, cat}));
    }
    storageReady = true;
  } catch(e){
    if (e && e.trulyNotFound){
      // Caso legítimo: a chave realmente ainda não existe (primeira utilização).
      entries = SEED.map(([pt,de,cat]) => ({id: uid(), pt, de, cat}));
      storageReady = true;
    } else {
      // Erro de rede/servidor/autenticação — NUNCA presumir que os dados não existem.
      // Não continuar, não guardar nada, não arriscar sobrescrever dados reais.
      loadError = (e && e.message) ? e.message : 'Erro desconhecido ao carregar o vocabulário.';
      entries = [];
      storageReady = false;
      renderLoadError();
      return;
    }
  }

  let meta = { renamesApplied: 0, seedWordsApplied: 0, categoryRenamesApplied: 0, deletionsApplied: 0, entryCategoryMovesApplied: 0 };
  try {
    const metaRes = await window.storage.get('vocab:meta', false);
    if (metaRes && metaRes.value) meta = JSON.parse(metaRes.value);
  } catch(e){ /* usar valores por omissão */ }

  let changed = false;

  // Só aplica as renomeações/palavras novas que ainda não foram processadas.
  // Assim, o que estiver em Lista (incluindo edições e eliminações) é sempre a versão válida —
  // estas listas fixas nunca voltam a sobrepor-se ao que já foi tratado uma vez.
  const pendingCategoryRenames = CATEGORY_RENAMES.slice(meta.categoryRenamesApplied || 0);
  pendingCategoryRenames.forEach(([oldCat, newCat]) => {
    entries.forEach(e => {
      if (e.cat === oldCat){
        e.cat = newCat;
        changed = true;
      }
    });
  });
  meta.categoryRenamesApplied = CATEGORY_RENAMES.length;

  const pendingEntryCategoryMoves = ENTRY_CATEGORY_MOVES.slice(meta.entryCategoryMovesApplied || 0);
  pendingEntryCategoryMoves.forEach(([pt, newCat]) => {
    const match = entries.find(e => e.pt.trim().toLowerCase() === pt.trim().toLowerCase());
    if (match){
      match.cat = newCat;
      changed = true;
    }
  });
  meta.entryCategoryMovesApplied = ENTRY_CATEGORY_MOVES.length;

  const pendingDeletions = DELETIONS.slice(meta.deletionsApplied || 0);
  if (pendingDeletions.length){
    const beforeCount = entries.length;
    const toDelete = new Set(pendingDeletions.map(pt => pt.trim().toLowerCase()));
    entries = entries.filter(e => !toDelete.has(e.pt.trim().toLowerCase()));
    if (entries.length !== beforeCount) changed = true;
  }
  meta.deletionsApplied = DELETIONS.length;

  const pendingRenames = RENAMES.slice(meta.renamesApplied || 0);
  pendingRenames.forEach(([oldPt, newPt, newDe]) => {
    const match = entries.find(e => e.pt.trim().toLowerCase() === oldPt.trim().toLowerCase());
    if (match){
      match.pt = newPt;
      match.de = newDe;
      changed = true;
    }
  });
  meta.renamesApplied = RENAMES.length;

  const pendingNewWords = NEW_WORDS.slice(meta.seedWordsApplied || 0);
  pendingNewWords.forEach(([pt, de, cat]) => {
    const exists = entries.some(e => e.pt.trim().toLowerCase() === pt.trim().toLowerCase());
    if (!exists){
      entries.push({id: uid(), pt, de, cat});
      changed = true;
    }
  });
  meta.seedWordsApplied = NEW_WORDS.length;

  entries.forEach(e => {
    if (!e.box || !e.nextDue){
      ensureSpacedFields(e);
      changed = true;
    }
  });

  if (changed){
    await saveEntries();
  }
  try {
    await window.storage.set('vocab:meta', JSON.stringify(meta), false);
  } catch(e){ /* não crítico */ }

  populateFilter();
  render();
}

async function saveEntries(){
  if (!storageReady){
    document.getElementById('content').insertAdjacentHTML('beforeend', '<div class="toast">⚠️ Vocabulário não foi carregado corretamente — guardar foi bloqueado por segurança. Recarrega a página.</div>');
    return;
  }
  try {
    await window.storage.set(editingKey, JSON.stringify(entries), false);
  } catch(e){
    document.getElementById('content').insertAdjacentHTML('beforeend', '<div class="toast">Erro ao guardar. Tenta novamente.</div>');
  }
}

  return Array.from(new Set([...DEFAULT_CATEGORIES, ...cats])).sort();

  const cats = Array.from(new Set(entries.map(e => e.cat))).sort();

  filter.innerHTML = '<option value="">Todas categorias</option>' + cats.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');
  const allCats = getAllCategories();
  newCat.innerHTML = allCats.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function render(){

  const filterCat = document.getElementById('filter').value;
  const filterBox = document.getElementById('box-filter').value;
  const content = document.getElementById('content');

  let filtered = entries.filter(e => {
    const matchesSearch = !search || e.pt.toLowerCase().includes(search) || e.de.toLowerCase().includes(search);
    const matchesCat = !filterCat || e.cat === filterCat;
    const matchesBox = !filterBox || String(e.box || 1) === filterBox;
    return matchesSearch && matchesCat && matchesBox;
  });

  document.getElementById('count').textContent = entries.length + ' palavras';

  if (filtered.length === 0){
    content.innerHTML = '<div class="empty">Nenhuma palavra encontrada.<br>Experimenta outra pesquisa ou adiciona uma palavra nova.</div>';
    return;
  }

  const groups = {};
  filtered.forEach(e => {
    if (!groups[e.cat]) groups[e.cat] = [];
    groups[e.cat].push(e);
  });

  let html = '';
  Object.keys(groups).sort().forEach(cat => {
    html += `<div class="cat-group"><div class="cat-title">${escapeHtml(cat)}</div>`;
    groups[cat].forEach(e => {
      if (e.id === editingId){
        const catOptions = getAllCategories().map(c => `<option value="${escapeAttr(c)}" ${c === e.cat ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
        html += `<div class="edit-form" data-editform="${e.id}">
          <div class="row">
            <input type="text" class="edit-pt" value="${escapeAttr(e.pt)}" placeholder="Palavra em português">
          </div>
          <div class="row">
            <input type="text" class="edit-de" value="${escapeAttr(e.de)}" placeholder="Tradução em alemão">
            <select class="edit-cat">${catOptions}</select>
          </div>
          <div class="field-error edit-field-error" style="display:none;"></div>
          <div class="edit-form-actions">
            <button class="edit-save-btn" data-save="${e.id}">Guardar</button>
            <button class="edit-cancel-btn" data-cancel="${e.id}">Cancelar</button>
          </div>
        </div>`;
      } else {
        const box = e.box || 1;
        const isOverdue = (e.nextDue || todayStr()) < todayStr();
        html += `<div class="card">
          <div class="word-block">
            <div class="pt">${escapeHtml(e.pt)}</div>
            <div class="de ${quizMode ? 'hidden-quiz' : ''}" data-id="${e.id}">${escapeHtml(e.de)}</div>
            <span class="box-badge box-${box} ${isOverdue ? 'overdue' : ''}">Caixa ${box}${isOverdue ? ' · atrasada' : ''}</span>
          </div>
          <div class="card-actions">
            <button class="edit-btn" data-edit="${e.id}" aria-label="Editar palavra">✎</button>
            <button class="del-btn" data-del="${e.id}" aria-label="Eliminar palavra">✕</button>
          </div>
        </div>`;
      }
    });
    html += '</div>';
  });

  content.innerHTML = html;

  content.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      entries = entries.filter(e => e.id !== btn.dataset.del);
      await saveEntries();
      populateFilter();
      render();
    });
  });

  content.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editingId = btn.dataset.edit;
      render();
    });
  });

  content.querySelectorAll('.edit-cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editingId = null;
      render();
    });
  });

  content.querySelectorAll('.edit-save-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const form = document.querySelector(`.edit-form[data-editform="${btn.dataset.save}"]`);
      const pt = form.querySelector('.edit-pt').value.trim();
      const de = form.querySelector('.edit-de').value.trim();
      const cat = form.querySelector('.edit-cat').value;
      const errEl = form.querySelector('.edit-field-error');

      if (!pt || !de){
        errEl.textContent = 'Preenche a palavra em português e a tradução.';
        errEl.style.display = 'block';
        return;
      }

      const entry = entries.find(e => e.id === btn.dataset.save);
      if (entry){
        entry.pt = pt;
        entry.de = de;
        entry.cat = cat;
      }
      editingId = null;
      await saveEntries();
      populateFilter();
      render();
    });
  });

  if (quizMode){
    content.querySelectorAll('.de').forEach(el => {
      el.addEventListener('click', () => {
        el.classList.toggle('hidden-quiz');
      });
    });
  }
}

function foldFirstChar(s){
  if (s.length === 0) return s;
  return s[0].toLowerCase() + s.slice(1);
}

function normalizeAnswer(s){
  return foldFirstChar(s.trim().replace(/\s+/g, ' '));
}

function buildDiffHtml(userVal, correctVal){
  const a = userVal.trim();
  const b = correctVal;
  const aCmp = foldFirstChar(a);
  const bCmp = foldFirstChar(b);
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++){
    for (let j = 1; j <= m; j++){
      if (aCmp[i - 1] === bCmp[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
      else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }
  const aParts = [];
  const bParts = [];
  let i = n, j = m;
  while (i > 0 && j > 0){
    if (aCmp[i - 1] === bCmp[j - 1]){
      aParts.push({ ch: a[i - 1], same: true });
      bParts.push({ ch: b[j - 1], same: true });
      i--; j--;
    } else if (dp[i - 1][j] >= dp[i][j - 1]){
      aParts.push({ ch: a[i - 1], same: false });
      i--;
    } else {
      bParts.push({ ch: b[j - 1], same: false });
      j--;
    }
  }
  while (i > 0){ aParts.push({ ch: a[i - 1], same: false }); i--; }
  while (j > 0){ bParts.push({ ch: b[j - 1], same: false }); j--; }
  aParts.reverse();
  bParts.reverse();

  const userHtml = aParts.map(p => p.same
    ? escapeHtml(p.ch)
    : `<span class="diff-extra">${escapeHtml(p.ch)}</span>`
  ).join('') || '<em>(vazio)</em>';

  const correctHtml = bParts.map(p => p.same
    ? escapeHtml(p.ch)
    : `<span class="diff-missing">${escapeHtml(p.ch)}</span>`
  ).join('');

  return { userHtml, correctHtml };
}

function startWriteQuiz(){
  const filterCat = document.getElementById('filter').value;
  entries.forEach(ensureSpacedFields);
  let pool = entries.filter(e => !filterCat || e.cat === filterCat);
  pool.forEach(e => { e._shuffleKey = Math.random(); });
  pool.sort((a, b) => {
    if (a.nextDue !== b.nextDue) return a.nextDue < b.nextDue ? -1 : 1;
    if (a.box !== b.box) return a.box - b.box;
    return a._shuffleKey - b._shuffleKey;
  });
  pool.forEach(e => { delete e._shuffleKey; });
  writeQueue = pool;
  writeIndex = 0;
  writeScore = 0;
  writeAnswered = 0;
  renderWriteQuestion();
}

function renderWriteQuestion(isRetry){
  writeIsRetry = !!isRetry;
  const card = document.getElementById('write-card');
  if (writeQueue.length === 0){
    card.innerHTML = '<div class="empty">Sem palavras para praticar. Adiciona palavras primeiro.</div>';
    return;
  }
  if (writeIndex >= writeQueue.length){
    const pct = writeAnswered ? Math.round((writeScore / writeAnswered) * 100) : 0;
    card.innerHTML = `
      <div class="write-de">Concluído!</div>
      <div class="write-score">Acertaste ${writeScore} de ${writeAnswered} (${pct}%)</div>
      <div class="write-actions">
        <button class="write-btn" id="write-restart">Recomeçar</button>
      </div>`;
    document.getElementById('write-restart').addEventListener('click', startWriteQuiz);
    return;
  }
  writeChecked = false;
  const item = writeQueue[writeIndex];
  const isOverdue = item.nextDue < todayStr();
  const dueLabel = isOverdue ? 'atrasada' : (item.box === 1 ? 'nova/fraca' : 'em revisão');
  const retryTag = writeIsRetry ? ' · repetição de treino (não altera a caixa)' : '';
  card.innerHTML = `
    <div class="write-progress">Palavra ${writeIndex + 1} de ${writeQueue.length} · Caixa ${item.box} (${dueLabel})${retryTag}</div>
    <span class="write-cat">${escapeHtml(item.cat)}</span>
    <div class="write-de">${escapeHtml(item.de)}</div>
    <input type="text" id="write-input" placeholder="Escreve a palavra em português" autocomplete="off">
    <div class="write-input-error" id="write-input-error"></div>
    <div id="write-feedback-slot"></div>
    <div class="write-actions">
      <button class="write-btn" id="write-check">Verificar</button>
    </div>
    <div class="write-score">Acertos: ${writeScore} / ${writeAnswered}</div>`;

  const input = document.getElementById('write-input');
  input.focus();
  document.getElementById('write-check').addEventListener('click', checkWriteAnswer);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      if (!writeChecked) checkWriteAnswer();
      else advanceWriteQuestion();
    }
  });
}

async function checkWriteAnswer(){
  if (writeChecked) return;
  const input = document.getElementById('write-input');
  const errEl = document.getElementById('write-input-error');
  const val = input.value;
  if (!val.trim()){
    errEl.textContent = 'Escreve uma resposta antes de verificar.';
    return;
  }
  errEl.textContent = '';
  writeChecked = true;
  const item = writeQueue[writeIndex];
  const correct = normalizeAnswer(val) === normalizeAnswer(item.pt);
  const diff = correct ? null : buildDiffHtml(val, item.pt);
  const diffBlock = diff
    ? `<div class="diff-line"><span class="diff-label">A tua resposta:</span><span class="diff-user">${diff.userHtml}</span></div>
       <div class="diff-line"><span class="diff-label">Resposta certa:</span><span class="diff-correct">${diff.correctHtml}</span></div>`
    : '';

  const slot = document.getElementById('write-feedback-slot');

  if (!writeIsRetry){
    writeAnswered++;
    if (correct) writeScore++;

    if (correct){
      item.box = Math.min((item.box || 1) + 1, MAX_BOX);
    } else {
      item.box = 1;
    }
    item.nextDue = addDaysStr(todayStr(), correct ? BOX_INTERVAL_DAYS[item.box] : 0);
    item.lastReviewed = todayStr();
    await saveEntries();

    slot.innerHTML = correct
      ? `<div class="write-feedback correct">Certo! Próxima revisão em ${BOX_INTERVAL_DAYS[item.box]} dia(s) (Caixa ${item.box}).</div>`
      : `<div class="write-feedback incorrect">Não é bem assim (volta à Caixa 1).${diffBlock}</div>`;
  } else {
    slot.innerHTML = correct
      ? `<div class="write-feedback correct">Certo! (treino — a caixa mantém-se em ${item.box})</div>`
      : `<div class="write-feedback incorrect">Ainda não (treino — a caixa mantém-se em ${item.box}).${diffBlock}</div>`;
  }

  document.querySelector('.write-score').textContent = `Acertos: ${writeScore} / ${writeAnswered}`;

  const actions = document.querySelector('.write-actions');
  const nextLabel = writeIndex + 1 < writeQueue.length ? 'Seguinte' : 'Ver resultado';
  if (correct){
    actions.innerHTML = `<button class="write-btn" id="write-next">${nextLabel}</button>`;
    document.getElementById('write-next').addEventListener('click', advanceWriteQuestion);
  } else {
    actions.innerHTML = `
      <button class="write-btn secondary" id="write-retry">Repetir agora</button>
      <button class="write-btn" id="write-next">${nextLabel}</button>`;
    document.getElementById('write-retry').addEventListener('click', retryWriteQuestion);
    document.getElementById('write-next').addEventListener('click', advanceWriteQuestion);
  }
  input.disabled = true;
}

function retryWriteQuestion(){
  renderWriteQuestion(true);
}

function advanceWriteQuestion(){
  writeIndex++;
  renderWriteQuestion(false);
}

document.getElementById('add-submit').addEventListener('click', async () => {
  const pt = document.getElementById('new-pt').value.trim();
  const de = document.getElementById('new-de').value.trim();
  const cat = document.getElementById('new-cat').value;
  const errEl = document.getElementById('add-error');

  if (!pt || !de){
    errEl.textContent = 'Preenche a palavra em português e a tradução.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  entries.push({id: uid(), pt, de, cat});
  await saveEntries();
  document.getElementById('new-pt').value = '';
  document.getElementById('new-de').value = '';
  populateFilter();
  render();
});

document.getElementById('import-submit').addEventListener('click', async () => {
  const raw = document.getElementById('import-text').value;
  const errEl = document.getElementById('import-error');
  const summaryEl = document.getElementById('import-summary');
  errEl.style.display = 'none';
  summaryEl.innerHTML = '';

  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length === 0){
    errEl.textContent = 'Cola pelo menos uma linha no formato português | alemão | categoria.';
    errEl.style.display = 'block';
    return;
  }

  let added = 0, skippedDup = 0, invalid = 0;
  const addedWords = [];

  lines.forEach(line => {
    const parts = line.split('|').map(p => p.trim());
    const pt = parts[0] || '';
    const de = parts[1] || '';
    const cat = (parts[2] && parts[2].length > 0) ? parts[2] : 'Geral / Nuances';

    if (!pt || !de){
      invalid++;
      return;
    }
    const exists = entries.some(e => e.pt.trim().toLowerCase() === pt.toLowerCase());
    if (exists){
      skippedDup++;
      return;
    }
    entries.push({id: uid(), pt, de, cat});
    addedWords.push(pt);
    added++;
  });

  if (added > 0){
    await saveEntries();
    populateFilter();
  }

  let summaryHtml = `<strong>${added}</strong> palavra(s) adicionada(s).`;
  if (skippedDup > 0) summaryHtml += `<br><span class="import-skip">${skippedDup} já existiam e foram ignoradas.</span>`;
  if (invalid > 0) summaryHtml += `<br><span class="import-skip">${invalid} linha(s) inválida(s) (formato incorreto).</span>`;
  summaryEl.innerHTML = summaryHtml;

  if (added > 0){
    document.getElementById('import-text').value = '';
  }
});

loadEntries();
</script>
