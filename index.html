<script>
// --- Fala com a função serverless /api/vocab (Vercel KV) — dados disponíveis em qualquer dispositivo.
(function(){
  const TOKEN_KEY = 'vocabDeple:apiToken';

  function getToken(){
    let t = localStorage.getItem(TOKEN_KEY);
    if (!t){
      t = window.prompt('Password (a mesma em todos os dispositivos):') || '';
      if (t) localStorage.setItem(TOKEN_KEY, t);
    }
    return t;
  }

  async function apiRequest(method, key, value){
    const token = getToken();
    let url = '/api/vocab?key=' + encodeURIComponent(key) + '&token=' + encodeURIComponent(token);
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (method === 'POST'){
      opts.body = JSON.stringify({ key, value, token });
    }
    let res;
    try {
      res = await fetch(url, opts);
    } catch (networkErr){
      const e = new Error('Falha de rede ao contactar a API: ' + networkErr.message);
      e.isNetworkError = true;
      throw e;
    }
    if (res.status === 401){
      localStorage.removeItem(TOKEN_KEY);
      const e = new Error('Password incorreta. Recarrega a página para tentar novamente.');
      e.isAuthError = true;
      throw e;
    }
    if (!res.ok){
      const errBody = await res.json().catch(() => ({}));
      const e = new Error(errBody.error || ('Erro na API: ' + res.status));
      e.isServerError = true;
      throw e;
    }
    return res.json();
  }

  window.storage = {
    async get(key, shared){
      const data = await apiRequest('GET', key);
      if (data.value === null || data.value === undefined){
        const e = new Error('key not found: ' + key);
        e.trulyNotFound = true;
        throw e;
      }
      return { key, value: data.value, shared: !!shared };
    },
    async set(key, value, shared){
      await apiRequest('POST', key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      return { keys: [], prefix, shared: !!shared };
    }
  };
})();

function uid(){ return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

const BOX_INTERVAL_DAYS = { 1: 1, 2: 3, 3: 7, 4: 14, 5: 30, 6: 60 };
const MAX_BOX = 6;

function todayStr(){
  return new Date().toISOString().slice(0, 10);
}
function addDaysStr(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function ensureSpacedFields(e){
  if (!e.box) e.box = 1;
  if (!e.nextDue) e.nextDue = todayStr();
  return e;
}

function foldFirstChar(s){
  if (s.length === 0) return s;
  return s[0].toLowerCase() + s.slice(1);
}

function normalizeAnswer(s){
  let t = s.trim();
  t = t.replace(/\s*\/\s*/g, '/');
  t = t.replace(/\./g, '');
  t = t.replace(/\(/g, ' (').replace(/\)/g, ') ');
  t = t.replace(/[()]/g, '');
  t = t.replace(/\s+/g, ' ').trim();
  return foldFirstChar(t);
}

function buildDiffHtml(userVal, correctVal){
  const a = userVal.trim();
  const b = correctVal;
  const aCmp = foldFirstChar(a);
  const bCmp = foldFirstChar(b);
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++){
    for (let j = 1; j <= m; j++){
      if (aCmp[i - 1] === bCmp[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
      else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }
  const aParts = [];
  const bParts = [];
  let i = n, j = m;
  while (i > 0 && j > 0){
    if (aCmp[i - 1] === bCmp[j - 1]){
      aParts.push({ ch: a[i - 1], same: true });
      bParts.push({ ch: b[j - 1], same: true });
      i--; j--;
    } else if (dp[i - 1][j] >= dp[i][j - 1]){
      aParts.push({ ch: a[i - 1], same: false });
      i--;
    } else {
      bParts.push({ ch: b[j - 1], same: false });
      j--;
    }
  }
  while (i > 0){ aParts.push({ ch: a[i - 1], same: false }); i--; }
  while (j > 0){ bParts.push({ ch: b[j - 1], same: false }); j--; }
  aParts.reverse();
  bParts.reverse();

  const userHtml = aParts.map(p => p.same
    ? escapeHtml(p.ch)
    : `<span class="diff-extra">${escapeHtml(p.ch)}</span>`
  ).join('') || '<em>(vazio)</em>';

  const correctHtml = bParts.map(p => p.same
    ? escapeHtml(p.ch)
    : `<span class="diff-missing">${escapeHtml(p.ch)}</span>`
  ).join('');

  return { userHtml, correctHtml };
}

const PT_CHARS_LOWER = ['ã','õ','á','à','â','é','ê','í','ó','ô','ú','ç'];
const PT_CHARS_UPPER = ['Ã','Õ','Á','À','Â','É','Ê','Í','Ó','Ô','Ú','Ç'];

function insertAtCursor(input, char){
  const start = input.selectionStart != null ? input.selectionStart : input.value.length;
  const end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
  const val = input.value;
  input.value = val.slice(0, start) + char + val.slice(end);
  const newPos = start + char.length;
  input.focus();
  if (input.setSelectionRange) input.setSelectionRange(newPos, newPos);
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

function accentBarHtml(targetId){
  return `<div class="accent-bar" data-target="${targetId}">
    ${PT_CHARS_LOWER.map(c => `<button type="button" class="accent-key">${c}</button>`).join('')}
    <button type="button" class="accent-key accent-shift" title="Maiúsculas">⇧</button>
  </div>`;
}

function wireAccentBar(barEl){
  const targetId = barEl.dataset.target;
  let upper = false;
  function render(){
    const chars = upper ? PT_CHARS_UPPER : PT_CHARS_LOWER;
    barEl.querySelectorAll('.accent-key:not(.accent-shift)').forEach((btn, idx) => {
      btn.textContent = chars[idx];
    });
  }
  barEl.querySelectorAll('.accent-key').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('accent-shift')){
        upper = !upper;
        barEl.querySelector('.accent-shift').classList.toggle('active', upper);
        render();
        return;
      }
      const input = document.getElementById(targetId);
      if (input) insertAtCursor(input, btn.textContent);
    });
  });
}

function createTrainer(cfg){
  const p = cfg.prefix;
  const $ = (name) => document.getElementById(p + '-' + name);

  const SEED = cfg.seed || [];
  const NEW_WORDS = cfg.newWords || [];
  const RENAMES = cfg.renames || [];
  const DELETIONS = cfg.deletions || [];
  const CATEGORY_RENAMES = cfg.categoryRenames || [];
  const ENTRY_CATEGORY_MOVES = cfg.entryCategoryMoves || [];
  const DEFAULT_CATEGORIES = cfg.defaultCategories || [];

  let entries = [];
  let quizMode = false;
  let editingId = null;
  let storageReady = false;
  let loadError = null;

  let writeQueue = [];
  let writeIndex = 0;
  let writeScore = 0;
  let writeAnswered = 0;
  let writeChecked = false;
  let writeIsRetry = false;

  function mount(container){
    container.innerHTML = trainerShellHTML(cfg);
    wireStaticListeners();
  }

  function renderLoadError(){
    $('content').innerHTML = `<div class="empty" style="color:#A3402B; text-align:left; padding:16px;">
      ⚠️ <strong>Não foi possível carregar os dados</strong> (erro de ligação à API).<br><br>
      Por segurança, nada foi guardado nem apagado.<br><br>
      Recarrega a página para tentar novamente.<br><br>
      <span style="font-size:11px; color:#8A9490;">Detalhe técnico: ${escapeHtml(loadError || '')}</span>
    </div>`;
  }

  async function loadEntries(){
    try {
      const res = await window.storage.get(cfg.entriesKey, false);
      if (res && res.value) {
        entries = JSON.parse(res.value);
      } else {
        entries = SEED.map(([pt,de,cat]) => ({id: uid(), pt, de, cat}));
      }
      storageReady = true;
    } catch(e){
      if (e && e.trulyNotFound){
        entries = SEED.map(([pt,de,cat]) => ({id: uid(), pt, de, cat}));
        storageReady = true;
      } else {
        loadError = (e && e.message) ? e.message : 'Erro desconhecido ao carregar.';
        entries = [];
        storageReady = false;
        renderLoadError();
        return;
      }
    }

    let meta = { renamesApplied: 0, seedWordsApplied: 0, categoryRenamesApplied: 0, deletionsApplied: 0, entryCategoryMovesApplied: 0 };
    try {
      const metaRes = await window.storage.get(cfg.metaKey, false);
      if (metaRes && metaRes.value) meta = JSON.parse(metaRes.value);
    } catch(e){ /* usar valores por omissão */ }

    let changed = false;

    const pendingCategoryRenames = CATEGORY_RENAMES.slice(meta.categoryRenamesApplied || 0);
    pendingCategoryRenames.forEach(([oldCat, newCat]) => {
      entries.forEach(e => { if (e.cat === oldCat){ e.cat = newCat; changed = true; } });
    });
    meta.categoryRenamesApplied = CATEGORY_RENAMES.length;

    const pendingEntryCategoryMoves = ENTRY_CATEGORY_MOVES.slice(meta.entryCategoryMovesApplied || 0);
    pendingEntryCategoryMoves.forEach(([pt, newCat]) => {
      const match = entries.find(e => e.pt.trim().toLowerCase() === pt.trim().toLowerCase());
      if (match){ match.cat = newCat; changed = true; }
    });
    meta.entryCategoryMovesApplied = ENTRY_CATEGORY_MOVES.length;

    const pendingDeletions = DELETIONS.slice(meta.deletionsApplied || 0);
    if (pendingDeletions.length){
      const before = entries.length;
      const toDelete = new Set(pendingDeletions.map(pt => pt.trim().toLowerCase()));
      entries = entries.filter(e => !toDelete.has(e.pt.trim().toLowerCase()));
      if (entries.length !== before) changed = true;
    }
    meta.deletionsApplied = DELETIONS.length;

    const pendingRenames = RENAMES.slice(meta.renamesApplied || 0);
    pendingRenames.forEach(([oldPt, newPt, newDe]) => {
      const match = entries.find(e => e.pt.trim().toLowerCase() === oldPt.trim().toLowerCase());
      if (match){ match.pt = newPt; match.de = newDe; changed = true; }
    });
    meta.renamesApplied = RENAMES.length;

    const pendingNewWords = NEW_WORDS.slice(meta.seedWordsApplied || 0);
    pendingNewWords.forEach(([pt, de, cat]) => {
      const exists = entries.some(e => e.pt.trim().toLowerCase() === pt.trim().toLowerCase());
      if (!exists){ entries.push({id: uid(), pt, de, cat}); changed = true; }
    });
    meta.seedWordsApplied = NEW_WORDS.length;

    entries.forEach(e => {
      if (!e.box || !e.nextDue){ ensureSpacedFields(e); changed = true; }
    });

    if (changed){ await saveEntries(); }
    try { await window.storage.set(cfg.metaKey, JSON.stringify(meta), false); } catch(e){ /* não crítico */ }

    populateFilter();
    render();
  }

  async function saveEntries(){
    if (!storageReady){
      $('content').insertAdjacentHTML('beforeend', '<div class="toast">⚠️ Dados não carregados corretamente — guardar bloqueado por segurança. Recarrega a página.</div>');
      return;
    }
    try {
      await window.storage.set(cfg.entriesKey, JSON.stringify(entries), false);
    } catch(e){
      $('content').insertAdjacentHTML('beforeend', '<div class="toast">Erro ao guardar. Tenta novamente.</div>');
    }
  }

  function getAllCategories(){
    const cats = Array.from(new Set(entries.map(e => e.cat)));
    return Array.from(new Set([...DEFAULT_CATEGORIES, ...cats])).sort();
  }

  function populateFilter(){
    const cats = Array.from(new Set(entries.map(e => e.cat))).sort();
    $('filter').innerHTML = `<option value="">${cfg.allGroupsLabel}</option>` + cats.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');
    const allCats = getAllCategories();
    $('new-cat').innerHTML = allCats.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');
  }

  function render(){
    const search = $('search').value.trim().toLowerCase();
    const filterCat = $('filter').value;
    const filterBox = $('box-filter').value;
    const content = $('content');

    let filtered = entries.filter(e => {
      const matchesSearch = !search || e.pt.toLowerCase().includes(search) || e.de.toLowerCase().includes(search);
      const matchesCat = !filterCat || e.cat === filterCat;
      const matchesBox = !filterBox || String(e.box || 1) === filterBox;
      return matchesSearch && matchesCat && matchesBox;
    });

    $('count').textContent = entries.length + ' ' + cfg.countLabel;

    if (filtered.length === 0){
      content.innerHTML = `<div class="empty">${cfg.emptyMessage}</div>`;
      return;
    }

    const groups = {};
    filtered.forEach(e => { (groups[e.cat] = groups[e.cat] || []).push(e); });

    let html = '';
    Object.keys(groups).sort().forEach(cat => {
      html += `<div class="cat-group"><div class="cat-title">${escapeHtml(cat)}</div>`;

      if (cfg.groupedCardView){
        html += `<div class="conj-group-card">`;
        groups[cat].forEach(e => {
          if (e.id === editingId){
            const catOptions = getAllCategories().map(c => `<option value="${escapeAttr(c)}" ${c === e.cat ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
            html += `<div class="conj-cell conj-cell-edit">
              <div class="edit-form" data-editform="${e.id}">
                <div class="row"><input type="text" class="edit-pt" value="${escapeAttr(e.pt)}" placeholder="${escapeAttr(cfg.frontFieldName)}"></div>
                <div class="row">
                  <input type="text" class="edit-de" value="${escapeAttr(e.de)}" placeholder="${escapeAttr(cfg.backFieldName)}">
                  <select class="edit-cat">${catOptions}</select>
                </div>
                <div class="field-error edit-field-error" style="display:none;"></div>
                <div class="edit-form-actions">
                  <button class="edit-save-btn" data-save="${e.id}">Guardar</button>
                  <button class="edit-cancel-btn" data-cancel="${e.id}">Cancelar</button>
                </div>
              </div>
            </div>`;
          } else {
            const box = e.box || 1;
            const isOverdue = (e.nextDue || todayStr()) < todayStr();
            html += `<div class="conj-cell">
              <button class="conj-cell-del" data-del="${e.id}" aria-label="Eliminar">✕</button>
              <div class="conj-cell-body" data-edit="${e.id}">
                <div class="conj-pt">${escapeHtml(e.pt)}</div>
                <div class="conj-de">${escapeHtml(e.de)}</div>
                <span class="box-badge box-${box} ${isOverdue ? 'overdue' : ''}">C${box}</span>
              </div>
            </div>`;
          }
        });
        html += `</div>`;
      } else {
        groups[cat].forEach(e => {
          if (e.id === editingId){
            const catOptions = getAllCategories().map(c => `<option value="${escapeAttr(c)}" ${c === e.cat ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
            html += `<div class="edit-form" data-editform="${e.id}">
              <div class="row"><input type="text" class="edit-pt" value="${escapeAttr(e.pt)}"></div>
              <div class="row">
                <input type="text" class="edit-de" value="${escapeAttr(e.de)}">
                <select class="edit-cat">${catOptions}</select>
              </div>
              <div class="field-error edit-field-error" style="display:none;"></div>
              <div class="edit-form-actions">
                <button class="edit-save-btn" data-save="${e.id}">Guardar</button>
                <button class="edit-cancel-btn" data-cancel="${e.id}">Cancelar</button>
              </div>
            </div>`;
          } else {
            const box = e.box || 1;
            const isOverdue = (e.nextDue || todayStr()) < todayStr();
            html += `<div class="card">
              <div class="word-block">
                <div class="pt">${escapeHtml(e.pt)}</div>
                <div class="de ${quizMode ? 'hidden-quiz' : ''}" data-id="${e.id}">${escapeHtml(e.de)}</div>
                <span class="box-badge box-${box} ${isOverdue ? 'overdue' : ''}">Caixa ${box}${isOverdue ? ' · atrasada' : ''}</span>
              </div>
              <div class="card-actions">
                <button class="edit-btn" data-edit="${e.id}" aria-label="Editar">✎</button>
                <button class="del-btn" data-del="${e.id}" aria-label="Eliminar">✕</button>
              </div>
            </div>`;
          }
        });
      }
      html += '</div>';
    });
    content.innerHTML = html;

    content.querySelectorAll('.del-btn, .conj-cell-del').forEach(btn => {
      btn.addEventListener('click', async () => {
        entries = entries.filter(e => e.id !== btn.dataset.del);
        await saveEntries();
        populateFilter();
        render();
      });
    });
    content.querySelectorAll('.edit-btn, .conj-cell-body').forEach(btn => {
      btn.addEventListener('click', () => { editingId = btn.dataset.edit; render(); });
    });
    content.querySelectorAll('.edit-cancel-btn').forEach(btn => {
      btn.addEventListener('click', () => { editingId = null; render(); });
    });
    content.querySelectorAll('.edit-save-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const form = content.querySelector(`.edit-form[data-editform="${btn.dataset.save}"]`);
        const pt = form.querySelector('.edit-pt').value.trim();
        const de = form.querySelector('.edit-de').value.trim();
        const cat = form.querySelector('.edit-cat').value;
        const errEl = form.querySelector('.edit-field-error');
        if (!pt || !de){ errEl.textContent = 'Preenche ambos os campos.'; errEl.style.display = 'block'; return; }
        const entry = entries.find(e => e.id === btn.dataset.save);
        if (entry){ entry.pt = pt; entry.de = de; entry.cat = cat; }
        editingId = null;
        await saveEntries();
        populateFilter();
        render();
      });
    });

    if (quizMode){
      content.querySelectorAll('.de').forEach(el => {
        el.addEventListener('click', () => { el.classList.toggle('hidden-quiz'); });
      });
    }
  }

  function setActiveMode(id){
    const modes = ['mode-list','mode-write','mode-add','mode-import'];
    if (cfg.enableQuiz) modes.push('mode-quiz');
    modes.forEach(m => { const el = $(m); if (el) el.classList.toggle('active', m === id); });
  }

  function hideAllPanels(){
    $('add-panel').style.display = 'none';
    $('import-panel').style.display = 'none';
    $('write-panel').style.display = 'none';
    $('content').style.display = '';
  }

  function wireStaticListeners(){
    $('search').addEventListener('input', render);
    $('filter').addEventListener('change', render);
    $('box-filter').addEventListener('change', render);

    $('mode-list').addEventListener('click', () => {
      quizMode = false; editingId = null;
      setActiveMode('mode-list'); hideAllPanels(); render();
    });
    if (cfg.enableQuiz){
      $('mode-quiz').addEventListener('click', () => {
        quizMode = true; editingId = null;
        setActiveMode('mode-quiz'); hideAllPanels(); render();
      });
    }
    $('mode-write').addEventListener('click', () => {
      setActiveMode('mode-write'); hideAllPanels();
      $('content').style.display = 'none';
      $('write-panel').style.display = 'block';
      startWriteQuiz();
    });
    $('mode-add').addEventListener('click', () => {
      setActiveMode('mode-add'); hideAllPanels();
      $('add-panel').style.display = 'block';
    });
    $('mode-import').addEventListener('click', () => {
      setActiveMode('mode-import'); hideAllPanels();
      $('import-panel').style.display = 'block';
    });

    document.querySelectorAll(`.accent-bar[data-target="${p}-new-pt"]`).forEach(wireAccentBar);

    $('add-submit').addEventListener('click', async () => {
      const pt = $('new-pt').value.trim();
      const de = $('new-de').value.trim();
      const cat = $('new-cat').value;
      const errEl = $('add-error');
      if (!pt || !de){ errEl.textContent = 'Preenche ambos os campos.'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      entries.push({id: uid(), pt, de, cat});
      await saveEntries();
      $('new-pt').value = ''; $('new-de').value = '';
      populateFilter(); render();
    });

    $('import-submit').addEventListener('click', async () => {
      const raw = $('import-text').value;
      const errEl = $('import-error');
      const summaryEl = $('import-summary');
      errEl.style.display = 'none';
      summaryEl.innerHTML = '';
      const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0){
        errEl.textContent = 'Cola pelo menos uma linha.';
        errEl.style.display = 'block';
        return;
      }
      let added = 0, skippedDup = 0, invalid = 0;
      lines.forEach(line => {
        const parts = line.split('|').map(x => x.trim());
        const pt = parts[0] || '';
        const de = parts[1] || '';
        const cat = (parts[2] && parts[2].length > 0) ? parts[2] : (cfg.defaultImportCategory || 'Geral');
        if (!pt || !de){ invalid++; return; }
        const exists = entries.some(e => e.pt.trim().toLowerCase() === pt.toLowerCase());
        if (exists){ skippedDup++; return; }
        entries.push({id: uid(), pt, de, cat});
        added++;
      });
      if (added > 0){ await saveEntries(); populateFilter(); }
      let summaryHtml = `<strong>${added}</strong> item(ns) adicionado(s).`;
      if (skippedDup > 0) summaryHtml += `<br><span class="import-skip">${skippedDup} já existiam.</span>`;
      if (invalid > 0) summaryHtml += `<br><span class="import-skip">${invalid} linha(s) inválida(s).</span>`;
      summaryEl.innerHTML = summaryHtml;
      if (added > 0) $('import-text').value = '';
    });
  }

  function startWriteQuiz(){
    const filterCat = $('filter').value;
    entries.forEach(ensureSpacedFields);
    let pool = entries.filter(e => !filterCat || e.cat === filterCat);
    pool.forEach(e => { e._shuffleKey = Math.random(); });
    pool.sort((a, b) => {
      if (a.nextDue !== b.nextDue) return a.nextDue < b.nextDue ? -1 : 1;
      if (a.box !== b.box) return a.box - b.box;
      return a._shuffleKey - b._shuffleKey;
    });
    pool.forEach(e => { delete e._shuffleKey; });
    writeQueue = pool;
    writeIndex = 0; writeScore = 0; writeAnswered = 0;
    renderWriteQuestion(false);
  }

  function renderWriteQuestion(isRetry){
    writeIsRetry = !!isRetry;
    const card = $('write-card');
    if (writeQueue.length === 0){
      card.innerHTML = `<div class="empty">${cfg.emptyPracticeMessage}</div>`;
      return;
    }
    if (writeIndex >= writeQueue.length){
      const pct = writeAnswered ? Math.round((writeScore / writeAnswered) * 100) : 0;
      card.innerHTML = `
        <div class="write-de">Concluído!</div>
        <div class="write-score">Acertaste ${writeScore} de ${writeAnswered} (${pct}%)</div>
        <div class="write-actions"><button class="write-btn" id="${p}-write-restart">Recomeçar</button></div>`;
      $('write-restart').addEventListener('click', startWriteQuiz);
      return;
    }
    writeChecked = false;
    const item = writeQueue[writeIndex];
    const isOverdue = item.nextDue < todayStr();
    const dueLabel = isOverdue ? 'atrasada' : (item.box === 1 ? 'nova/fraca' : 'em revisão');
    const retryTag = writeIsRetry ? ' · repetição de treino (não altera a caixa)' : '';
    const inputId = p + '-write-input';
    card.innerHTML = `
      <div class="write-progress">${writeIndex + 1} de ${writeQueue.length} · Caixa ${item.box} (${dueLabel})${retryTag}</div>
      <span class="write-cat">${escapeHtml(item.cat)}</span>
      <div class="write-de">${escapeHtml(item.de)}</div>
      <input type="text" id="${inputId}" class="write-input-el" placeholder="${cfg.answerPlaceholder}" autocomplete="off">
      ${accentBarHtml(inputId)}
      <div class="write-input-error" id="${p}-write-input-error"></div>
      <div id="${p}-write-feedback-slot"></div>
      <div class="write-actions"><button class="write-btn" id="${p}-write-check">Verificar</button></div>
      <div class="write-score">Acertos: ${writeScore} / ${writeAnswered}</div>`;

    const input = $('write-input');
    input.focus();
    document.querySelectorAll(`.accent-bar[data-target="${inputId}"]`).forEach(wireAccentBar);
    $('write-check').addEventListener('click', checkWriteAnswer);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){
        if (!writeChecked) checkWriteAnswer();
        else advanceWriteQuestion();
      }
    });
  }

  async function checkWriteAnswer(){
    if (writeChecked) return;
    const input = $('write-input');
    const errEl = $('write-input-error');
    const val = input.value;
    if (!val.trim()){ errEl.textContent = 'Escreve uma resposta antes de verificar.'; return; }
    errEl.textContent = '';
    writeChecked = true;
    const item = writeQueue[writeIndex];
    const correct = normalizeAnswer(val) === normalizeAnswer(item.pt);
    const diff = correct ? null : buildDiffHtml(val, item.pt);
    const diffBlock = diff
      ? `<div class="diff-line"><span class="diff-label">A tua resposta:</span><span class="diff-user">${diff.userHtml}</span></div>
         <div class="diff-line"><span class="diff-label">Resposta certa:</span><span class="diff-correct">${diff.correctHtml}</span></div>`
      : '';
    const slot = $('write-feedback-slot');

    if (!writeIsRetry){
      writeAnswered++;
      if (correct) writeScore++;
      if (correct){ item.box = Math.min((item.box || 1) + 1, MAX_BOX); }
      else { item.box = 1; }
      item.nextDue = addDaysStr(todayStr(), correct ? BOX_INTERVAL_DAYS[item.box] : 0);
      item.lastReviewed = todayStr();
      await saveEntries();
      slot.innerHTML = correct
        ? `<div class="write-feedback correct">Certo! Próxima revisão em ${BOX_INTERVAL_DAYS[item.box]} dia(s) (Caixa ${item.box}).</div>`
        : `<div class="write-feedback incorrect">Não é bem assim (volta à Caixa 1).${diffBlock}</div>`;
    } else {
      slot.innerHTML = correct
        ? `<div class="write-feedback correct">Certo! (treino — a caixa mantém-se em ${item.box})</div>`
        : `<div class="write-feedback incorrect">Ainda não (treino — a caixa mantém-se em ${item.box}).${diffBlock}</div>`;
    }

    $('write-card').querySelector('.write-score').textContent = `Acertos: ${writeScore} / ${writeAnswered}`;
    const actions = $('write-card').querySelector('.write-actions');
    const nextLabel = writeIndex + 1 < writeQueue.length ? 'Seguinte' : 'Ver resultado';
    if (correct){
      actions.innerHTML = `<button class="write-btn" id="${p}-write-next">${nextLabel}</button>`;
      $('write-next').addEventListener('click', advanceWriteQuestion);
    } else {
      actions.innerHTML = `
        <button class="write-btn secondary" id="${p}-write-retry">Repetir agora</button>
        <button class="write-btn" id="${p}-write-next">${nextLabel}</button>`;
      $('write-retry').addEventListener('click', () => renderWriteQuestion(true));
      $('write-next').addEventListener('click', advanceWriteQuestion);
    }
    input.disabled = true;
  }

  function advanceWriteQuestion(){
    writeIndex++;
    renderWriteQuestion(false);
  }

  return {
    mount,
    init: loadEntries
  };
}
